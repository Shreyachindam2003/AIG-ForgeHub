spring.application.name=AIG-ForgeHub

# ===============================
# Database Configuration
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/forgehub
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT Configuration
# ===============================

jwt.secret=this-is-my-aig-forge-hub-jwt-secret-key-for-authentication-123456789

#5minutes
jwt.access-token-expiration-ms=300000
jwt.refresh-token-expiration-ms=2592000000
jwt.remember-me-expiration-ms=2592000000
jwt.recovery-token-expiration-ms=900000


# ===============================
# Email Configuration
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=shreyachindam2003@gmail.com
spring.mail.password=rviy sddi iwnn xocl

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Thymeleaf
# ===============================

spring.thymeleaf.cache=false

# ===============================
# Server
# ===============================

server.port=8080

# ===============================
# Logging
# ===============================

logging.level.root=INFO
logging.level.com.example.AIG_ForgeHub=INFO
logging.level.org.springframework.security=INFO

logging.file.name=logs/forgehub.log

logging.logback.rollingpolicy.file-name-pattern=logs/forgehub-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
logging.logback.rollingpolicy.clean-history-on-start=false