<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Login - AIG Forge Hub</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="brand">

            ⚙
            <span>AIG Forge Hub</span>

        </div>

        <h2>Login</h2>

        <p class="subtitle">
            Login to access your AIG ForgeHub account
        </p>

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <form th:action="@{/auth/login}"
              method="post">

            <div class="mb-3">

                <label class="form-label">
                    Enter Email
                </label>

                <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Type your Email here"
                        required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Enter your Password
                </label>

                <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Type your password here"
                        required>

            </div>

            <div class="remember-row">

                <label>

                    <input
                            type="checkbox"
                            name="rememberMe">

                    Remember me?

                </label>

                <a href="/auth/forgot-password">
                    Forgot Password?
                </a>

            </div>

            <button
                    type="submit"
                    class="btn login-btn">

                Submit

            </button>

        </form>

    </div>

</div>

</body>
</html>
