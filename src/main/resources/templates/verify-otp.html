<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Verify Code</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row min-vh-100">

        <div class="col-md-6 d-flex align-items-center justify-content-center">

            <div class="login-box">

                <h2>Verify Code</h2>

                <p class="subtitle">
                    Enter the 6-digit code from Google Authenticator
                </p>

                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <form th:action="@{/2fa/verify}"
                      method="post">

                    <input type="hidden"
                           name="email"
                           th:value="${email}">

                    <input type="hidden"
                           name="rememberMe"
                           th:value="${rememberMe}">

                    <div class="mb-3">

                        <label class="form-label">
                            OTP Code
                        </label>

                        <input type="text"
                               id="otp"
                               name="otp"
                               maxlength="6"
                               minlength="6"
                               pattern="[0-9]{6}"
                               class="form-control"
                               placeholder="Enter your 6-digit OTP"
                               required>

                    </div>

                    <div class="lost-link">

                        <a href="/auth/lost-otp">
                            Lost your OTP?
                        </a>

                    </div>

                    <button type="submit"
                            class="btn login-btn">

                        Verify

                    </button>

                </form>

            </div>

        </div>

        <div class="col-md-6 verify-image-section">

            <div class="verify-illustration">
                🔐
            </div>

        </div>

    </div>

</div>

</body>
</html>
