<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Verify Code</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row min-vh-100">

        <div class="col-md-6
                    d-flex
                    align-items-center
                    justify-content-center">

            <div class="login-box">

                <h2>Verify Code</h2>

                <p class="subtitle">
                    Enter the 6-digit code from Google Authenticator
                </p>

                <div id="errorMessage"
                     class="alert alert-danger"
                     style="display:none;">
                </div>

                <form id="verifyForm">

                    <div class="mb-3">

                        <label class="form-label">
                            OTP Code
                        </label>

                        <input
                                type="text"
                                id="otp"
                                name="otp"
                                maxlength="6"
                                minlength="6"
                                pattern="[0-9]{6}"
                                class="form-control"
                                placeholder="Enter your 6-digit OTP"
                                required>

                    </div>

                    <div class="lost-link">

                        <a href="/auth/lost-otp">
                            Lost your OTP?
                        </a>

                    </div>

                    <button
                            type="submit"
                            class="btn login-btn">

                        Verify

                    </button>

                </form>

            </div>

        </div>

        <div class="col-md-6 verify-image-section">

            <div class="verify-illustration">

                🔐

            </div>

        </div>

    </div>

</div>


<script>

    const token =
        sessionStorage.getItem("accessToken");


    if (!token) {

        window.location.href = "/auth/login";

    }


    document
        .getElementById("verifyForm")
        .addEventListener("submit", function (event) {

            event.preventDefault();


            const otp =
                document.getElementById("otp").value;


            const errorMessage =
                document.getElementById("errorMessage");


            fetch("/2fa/verify", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/x-www-form-urlencoded",

                    "Authorization":
                        "Bearer " + token

                },

                body:
                    "otp=" +
                    encodeURIComponent(otp)

            })

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "OTP verification request failed"
                        );

                    }

                    return response.json();

                })

                .then(data => {

                    console.log(
                        "========== OTP RESPONSE =========="
                    );

                    console.log(
                        "SUCCESS =",
                        data.success
                    );


                    if (!data.success) {

                        errorMessage.innerText =
                            data.message ||
                            "Invalid or expired OTP";

                        errorMessage.style.display =
                            "block";

                        return;

                    }


                    /*
                     * OTP successfully verified.
                     *
                     * Backend ne final JWT generate kiya hai.
                     * Is JWT mein mfaVerified=true hai.
                     */

                    const finalToken =
                        data.accessToken;


                    const nextPage =
                        data.nextPage;


                    sessionStorage.setItem(
                        "accessToken",
                        finalToken
                    );


                    console.log(
                        "FINAL TOKEN SAVED =",
                        finalToken != null
                    );

                    console.log(
                        "NEXT PAGE =",
                        nextPage
                    );


                    /*
                     * Dashboard ko Authorization header
                     * ke saath request kar rahe hain.
                     */

                    return fetch(nextPage, {

                        method: "GET",

                        headers: {

                            "Authorization":
                                "Bearer " + finalToken

                        }

                    });

                })

                .then(response => {

                    if (!response) {

                        return;

                    }


                    console.log(
                        "DASHBOARD STATUS =",
                        response.status
                    );


                    if (!response.ok) {

                        throw new Error(
                            "Unable to open dashboard"
                        );

                    }


                    return response.text();

                })

                .then(html => {

                    if (!html) {

                        return;

                    }


                    document.open();

                    document.write(html);

                    document.close();

                })

                .catch(error => {

                    console.error(error);

                    errorMessage.innerText =
                        "OTP verification failed";

                    errorMessage.style.display =
                        "block";

                });

        });

</script>

</body>

</html>
