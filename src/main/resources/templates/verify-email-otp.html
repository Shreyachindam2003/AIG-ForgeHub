<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Verify Email OTP</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row min-vh-100">

        <div class="col-md-6
                    d-flex
                    align-items-center
                    justify-content-center">

            <div class="login-box">

                <h2>Verify Email OTP</h2>

                <p class="subtitle">
                    Enter the OTP sent to your registered email.
                </p>

                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <form th:action="@{/auth/verify-email-otp}"
                      method="post">

                    <input type="hidden"
                           name="email"
                           th:value="${email}">

                    <div class="mb-3">

                        <label class="form-label">
                            Email OTP
                        </label>

                        <input
                                type="text"
                                name="otp"
                                maxlength="6"
                                minlength="6"
                                pattern="[0-9]{6}"
                                class="form-control"
                                placeholder="Enter 6-digit OTP"
                                required>

                    </div>

                    <button
                            type="submit"
                            class="btn login-btn">

                        Verify

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
