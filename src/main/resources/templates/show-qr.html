<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Google Authentication</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row min-vh-100">

        <div class="col-md-6 d-flex align-items-center justify-content-center">

            <div class="qr-box">

                <a href="/auth/login" class="back-link">
                    ← Back To Login
                </a>

                <h2>
                    Scan the QR code below
                </h2>

                <p class="subtitle">
                    to authenticate yourself via Google.
                </p>

                <div class="qr-container">

                    <img id="qrImage"
                         th:src="${qrCode}"
                         alt="Google Authenticator QR Code">

                </div>

                <form th:action="@{/2fa/proceed}" method="post">

                    <input type="hidden"
                           name="accessToken"
                           th:value="${accessToken}">

                    <input type="hidden"
                           name="refreshToken"
                           th:value="${refreshToken}">

                    <button type="submit"
                            class="btn login-btn">

                        Proceed

                    </button>

                </form>

            </div>

        </div>

        <div class="col-md-6 qr-image-section">

            <div class="qr-illustration">
                📱
            </div>

        </div>

    </div>

</div>

</body>

</html>
