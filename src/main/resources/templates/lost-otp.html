<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Lost OTP</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row min-vh-100">

        <div class="col-md-6
                    d-flex
                    align-items-center
                    justify-content-center">

            <div class="login-box">

                <h2>Lost OTP</h2>

                <p class="subtitle">
                    Enter your registered email to get a new code
                </p>

                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <form th:action="@{/auth/lost-otp}"
                      method="post">

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email address"
                                required>

                    </div>

                    <button
                            type="submit"
                            class="btn login-btn">

                        Send OTP

                    </button>

                </form>

            </div>

        </div>

        <div class="col-md-6 lost-image-section">

            <div class="lost-illustration">
                🔑
            </div>

        </div>

    </div>

</div>

</body>
</html>
