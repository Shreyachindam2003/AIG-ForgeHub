<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Admin Dashboard - AIG Forge Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand">
            AIG Forge Hub - Admin
        </span>

        <form th:action="@{/auth/logout}"
              method="post">

            <button type="submit"
                    class="btn btn-light">

                Logout

            </button>

        </form>

    </div>

</nav>

<div class="container mt-5">

    <h1>Admin Dashboard</h1>

    <p>
        Welcome Admin
    </p>

    <p th:text="${email}"></p>

</div>

</body>
</html>
