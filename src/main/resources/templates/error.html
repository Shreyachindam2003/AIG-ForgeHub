<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status + ' - ' + error}">Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card border-0 shadow-sm rounded-4 text-center p-5" style="max-width: 560px; width: 100%;">
        <div class="mx-auto mb-3 rounded-circle bg-danger-subtle text-danger d-flex align-items-center justify-content-center" style="width:64px;height:64px;">
            <i class="bi bi-exclamation-triangle fs-3"></i>
        </div>
        <div class="text-muted small mb-2" th:text="'Error ' + ${status}">Error 500</div>
        <h2 class="fw-bold mb-3">We couldn't complete that request</h2>
        <p class="text-secondary mb-4" th:text="${message}">Something went wrong.</p>
        <a href="javascript:history.back()" class="btn btn-primary px-4">
            <i class="bi bi-arrow-left me-1"></i> Go Back
        </a>
    </div>
</div>
</body>
</html>
