<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add RFQ - Admin</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <!-- Existing Admin CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/admin.css}">

    <style>

        /* Only for the stepper line */
        .step-item {
            position: relative;
        }

        .step-item:not(:last-child)::after {
            content: "";
            position: absolute;
            top: 20px;
            left: 60%;
            width: 80%;
            height: 2px;
            background: #dee2e6;
            z-index: 0;
        }

        .step-circle {
            position: relative;
            z-index: 1;
            width: 40px;
            height: 40px;
        }

        .step-content {
            display: none;
        }

        .step-content.active {
            display: block;
        }

    </style>

</head>


<body>

<!-- =========================================================
     ADMIN SIDEBAR
     ========================================================= -->

<div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>


<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main class="admin-content">

    <div class="container-fluid px-4 py-3">

        <!-- PAGE TITLE -->

        <h3 class="fw-semibold mb-4">
            Add RFQ
        </h3>


        <!-- =====================================================
             MAIN CARD
             ===================================================== -->

        <div class="bg-white rounded-4 shadow-sm p-4">


            <!-- =================================================
                 ALERTS
                 ================================================= -->

            <div
                    th:if="${param.success}"
                    class="alert alert-success alert-dismissible fade show"
                    role="alert">

                <span th:if="${param.success[0] == 'draft'}">
                    RFQ saved as draft successfully.
                </span>

                <span th:if="${param.success[0] == 'submitted'}">
                    RFQ submitted successfully.
                </span>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>

            </div>


            <div
                    th:if="${error}"
                    class="alert alert-danger alert-dismissible fade show"
                    role="alert">

                <span th:text="${error}">
                    Error
                </span>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>

            </div>


            <!-- =================================================
                 STEPPER
                 ================================================= -->

            <div class="row text-center mb-5">


                <!-- STEP 1 -->

                <div class="col-4 step-item">

                    <div
                            class="step-circle rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-semibold mx-auto">

                        1

                    </div>

                    <div class="mt-2">
                        RFQ BID DETAILS
                    </div>

                </div>


                <!-- STEP 2 -->

                <div class="col-4 step-item">

                    <div
                            class="step-circle rounded-circle bg-light border d-flex align-items-center justify-content-center fw-semibold mx-auto">

                        2

                    </div>

                    <div class="mt-2">
                        BID ITEMS
                    </div>

                </div>


                <!-- STEP 3 -->

                <div class="col-4 step-item">

                    <div
                            class="step-circle rounded-circle bg-light border d-flex align-items-center justify-content-center fw-semibold mx-auto">

                        3

                    </div>

                    <div class="mt-2">
                        DURATION AND VENDORS
                    </div>

                </div>

            </div>


            <!-- =================================================
                 FORM
                 ================================================= -->

            <form
                    th:action="@{/admin/rfq/save}"
                    th:object="${rfqRequest}"
                    method="post"
                    id="rfqForm">


                <!-- =================================================
                     STEP 1
                     ================================================= -->

                <div
                        class="step-content active"
                        data-content="1">


                    <div class="row g-4">


                        <!-- RFQ NO -->

                        <div class="col-md-6">

                            <label class="form-label fw-medium">
                                RFQ No
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    value="Generated after save"
                                    readonly>

                        </div>


                        <!-- INDENT NO -->

                        <div class="col-md-6">

                            <label class="form-label fw-medium">
                                Indent No
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    value="Generated after save"
                                    readonly>

                        </div>


                        <!-- MOBILE -->

                        <div class="col-md-6">

                            <label class="form-label fw-medium">
                                Mobile No
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{mobile}"
                                    placeholder="Enter mobile number">

                        </div>


                        <!-- CONTACT PERSON -->

                        <div class="col-md-6">

                            <label class="form-label fw-medium">
                                Contact Person
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{contactPerson}"
                                    placeholder="Enter contact person">

                        </div>

                    </div>


                    <!-- STEP 1 BUTTONS -->

                    <div class="d-flex justify-content-end gap-2 mt-4">

                        <button
                                type="button"
                                class="btn btn-outline-secondary"
                                onclick="saveDraft()">

                            Save as Draft

                        </button>

                        <button
                                type="button"
                                class="btn btn-primary px-4"
                                onclick="nextStep()">

                            Next

                            <i class="bi bi-arrow-right ms-1"></i>

                        </button>

                    </div>

                </div>


                <!-- =================================================
                     STEP 2
                     ================================================= -->

                <div
                        class="step-content"
                        data-content="2">


                    <!-- ITEM FORM -->

                    <div class="row g-3">


                        <!-- LINE NO -->

                        <div class="col-md-2">

                            <label class="form-label fw-medium">
                                Line No
                            </label>

                            <input
                                    type="text"
                                    class="form-control bg-light"
                                    id="lineNo"
                                    value="1"
                                    readonly>

                        </div>


                        <!-- ITEM NO -->

                        <div class="col-md-3">

                            <label class="form-label fw-medium">
                                Item No
                            </label>

                            <input
                                    type="text"
                                    class="form-control bg-light"
                                    id="itemNo"
                                    value="ITEM-000001"
                                    readonly>

                        </div>


                        <!-- FACTORY CODE -->

                        <div class="col-md-3">

                            <label class="form-label fw-medium">
                                Factory Code
                            </label>

                            <input
                                    type="text"
                                    class="form-control bg-light"
                                    id="factoryCode"
                                    value="FAC-000001"
                                    readonly>

                        </div>


                        <!-- ITEM NAME -->

                        <div class="col-md-4">

                            <label class="form-label fw-medium">
                                Item Name
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    id="itemName"
                                    placeholder="Enter item name">

                        </div>


                        <!-- QUANTITY -->

                        <div class="col-md-3">

                            <label class="form-label fw-medium">
                                Required Quantity
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                    type="number"
                                    class="form-control"
                                    id="reqQty"
                                    min="1"
                                    placeholder="Quantity">

                        </div>


                        <!-- UOM -->

                        <div class="col-md-3">

                            <label class="form-label fw-medium">
                                UOM
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    id="uom"
                                    placeholder="Nos">

                        </div>


                        <!-- DELIVERY DATE -->

                        <div class="col-md-3">

                            <label class="form-label fw-medium">
                                Required Delivery Date
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                    type="date"
                                    class="form-control"
                                    id="reqDeliveryDate">

                        </div>


                        <!-- DELIVERY LOCATION -->

                        <div class="col-md-3">

                            <label class="form-label fw-medium">
                                Delivery Location
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    id="deliveryLocation"
                                    placeholder="Enter location">

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="col-md-12">

                            <label class="form-label fw-medium">
                                Description
                            </label>

                            <textarea
                                    class="form-control"
                                    id="description"
                                    rows="2"
                                    placeholder="Enter description"></textarea>

                        </div>

                    </div>


                    <!-- ADD / UPDATE -->

                    <div class="text-end mt-3">

                        <button
                                type="button"
                                class="btn btn-primary"
                                id="itemActionButton"
                                onclick="addItem()">

                            <i class="bi bi-plus-lg me-1"></i>
                            Add Item

                        </button>

                    </div>


                    <!-- ITEM TABLE -->

                    <div class="table-responsive mt-4">

                        <table
                                class="table table-bordered table-hover align-middle">

                            <thead class="table-light">

                            <tr>

                                <th>Line No</th>

                                <th>Item No</th>

                                <th>Item Name</th>

                                <th>Qty</th>

                                <th>UOM</th>

                                <th>Delivery Date</th>

                                <th>Location</th>

                                <th>Factory Code</th>

                                <th>Description</th>

                                <th>Actions</th>

                            </tr>

                            </thead>


                            <tbody id="itemsTableBody">

                            <tr>

                                <td
                                        colspan="10"
                                        class="text-center text-muted py-4">

                                    No items added yet.

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>


                    <!-- STEP 2 BUTTONS -->

                    <div
                            class="d-flex justify-content-between align-items-center mt-4">


                        <button
                                type="button"
                                class="btn btn-secondary"
                                onclick="previousStep()">

                            <i class="bi bi-arrow-left me-1"></i>
                            Previous

                        </button>


                        <div class="d-flex gap-2">

                            <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="saveDraft()">

                                Save as Draft

                            </button>


                            <button
                                    type="button"
                                    class="btn btn-primary px-4"
                                    onclick="nextStep()">

                                Next

                                <i class="bi bi-arrow-right ms-1"></i>

                            </button>

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     STEP 3
                     ================================================= -->

                <div
                        class="step-content"
                        data-content="3">


                    <!-- =================================================
                         EXACT SECOND IMAGE STYLE
                         ================================================= -->

                    <div class="row g-4">


                        <!-- BID START DATE -->

                        <div class="col-md-6">

                            <label class="form-label fw-medium">

                                Bid Start Date

                                <span class="text-danger">*</span>

                            </label>

                            <input
                                    type="date"
                                    class="form-control"
                                    th:field="*{bidDate}"
                                    id="bidDate">

                        </div>


                        <!-- BID END DATE -->

                        <div class="col-md-6">

                            <label class="form-label fw-medium">

                                Bid End Date

                                <span class="text-danger">*</span>

                            </label>

                            <input
                                    type="date"
                                    class="form-control"
                                    th:field="*{expiryDateOfBid}"
                                    id="expiryDateOfBid">

                        </div>


                        <!-- SELECT VENDORS -->

                        <div class="col-md-6">

                            <label class="form-label fw-medium">

                                Select Vendors

                                <span class="text-danger">*</span>

                            </label>


                            <!-- BOOTSTRAP DROPDOWN -->

                            <div class="dropdown">

                                <button
                                        type="button"
                                        class="btn btn-outline-secondary dropdown-toggle w-100 text-start"
                                        data-bs-toggle="dropdown"
                                        data-bs-auto-close="outside"
                                        id="vendorDropdownButton">

                                    Select Vendors

                                </button>


                                <div
                                        class="dropdown-menu w-100 p-2">


                                    <!-- SELECT ALL -->

                                    <div class="form-check mb-2">

                                        <input
                                                type="checkbox"
                                                class="form-check-input"
                                                id="selectAllVendors">

                                        <label
                                                class="form-check-label fw-semibold"
                                                for="selectAllVendors">

                                            Select All

                                        </label>

                                    </div>


                                    <hr class="dropdown-divider">


                                    <!-- VENDORS -->

                                    <div
                                            th:each="vendor : ${vendors}"
                                            class="form-check mb-2">

                                        <input
                                                type="checkbox"
                                                class="form-check-input vendor-checkbox"
                                                name="vendorIds"
                                                th:value="${vendor.userId}"
                                                th:id="'vendor-' + ${vendor.userId}">

                                        <label
                                                class="form-check-label w-100"
                                                th:for="'vendor-' + ${vendor.userId}"
                                                th:text="${vendor.fullName}">

                                            Vendor Name

                                        </label>

                                    </div>


                                    <!-- NO VENDORS -->

                                    <div
                                            th:if="${#lists.isEmpty(vendors)}"
                                            class="text-center text-muted py-2">

                                        No vendors available.

                                    </div>

                                </div>

                            </div>


                            <div class="form-text">

                                Select one or multiple vendors.

                            </div>

                        </div>

                    </div>


                    <!-- =================================================
                         BUTTONS
                         ================================================= -->

                    <div
                            class="d-flex justify-content-between align-items-center mt-5">


                        <!-- LEFT -->

                        <button
                                type="button"
                                class="btn btn-secondary"
                                onclick="previousStep()">

                            <i class="bi bi-arrow-left me-1"></i>

                            Previous

                        </button>


                        <!-- RIGHT -->

                        <div class="d-flex gap-2">

                            <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="saveDraft()">

                                Save as Draft

                            </button>


                            <button
                                    type="submit"
                                    class="btn btn-success">

                                Submit RFQ

                            </button>

                        </div>

                    </div>

                </div>


                <!-- HIDDEN ACTION -->

                <input
                        type="hidden"
                        name="action"
                        id="actionField"
                        value="submit">

            </form>

        </div>

    </div>

</main>


<!-- =========================================================
     BOOTSTRAP JS
     ========================================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    let currentStep = 1;

    let items = [];

    let editIndex = -1;


    /* =========================================================
       STEP
       ========================================================= */

    function showStep(step) {

        currentStep = step;

        document
            .querySelectorAll(".step-content")
            .forEach(function (content) {

                content.classList.remove("active");

            });


        document
            .querySelector(
                `[data-content="${step}"]`
            )
            .classList.add("active");


        document
            .querySelectorAll(".step-circle")
            .forEach(function (circle, index) {

                const stepNumber = index + 1;

                circle.classList.remove(
                    "bg-primary",
                    "text-white"
                );

                circle.classList.add(
                    "bg-light"
                );


                if (stepNumber === step) {

                    circle.classList.remove(
                        "bg-light"
                    );

                    circle.classList.add(
                        "bg-primary",
                        "text-white"
                    );

                }

            });

    }


    function nextStep() {

        if (currentStep === 2 &&
            !validateStep2()) {

            return;

        }


        if (currentStep < 3) {

            showStep(currentStep + 1);

        }

    }


    function previousStep() {

        if (currentStep > 1) {

            showStep(currentStep - 1);

        }

    }


    function validateStep2() {

        if (items.length === 0) {

            alert("Please add at least one RFQ item.");

            return false;

        }

        return true;

    }


    /* =========================================================
       SAVE DRAFT
       ========================================================= */

    function saveDraft() {

        prepareItemsForSubmit();

        document
            .getElementById("actionField")
            .value = "draft";

        document
            .getElementById("rfqForm")
            .submit();

    }


    /* =========================================================
       ADD / UPDATE ITEM
       ========================================================= */

    function addItem() {

        const itemName =
            document.getElementById("itemName").value.trim();

        const reqQty =
            document.getElementById("reqQty").value;

        const uom =
            document.getElementById("uom").value.trim();

        const reqDeliveryDate =
            document.getElementById("reqDeliveryDate").value;

        const deliveryLocation =
            document.getElementById("deliveryLocation").value.trim();

        const description =
            document.getElementById("description").value.trim();


        if (!itemName) {

            alert("Please enter Item Name.");

            return;

        }


        if (!reqQty || parseInt(reqQty) <= 0) {

            alert("Required Quantity must be greater than 0.");

            return;

        }


        if (!uom) {

            alert("Please enter UOM.");

            return;

        }


        if (!reqDeliveryDate) {

            alert("Please select Required Delivery Date.");

            return;

        }


        const item = {

            itemName: itemName,

            reqQty: parseInt(reqQty),

            uom: uom,

            reqDeliveryDate: reqDeliveryDate,

            deliveryLocation: deliveryLocation,

            description: description

        };


        /* UPDATE */

        if (editIndex !== -1) {

            items[editIndex] = item;

            editIndex = -1;

        }

        /* ADD */

        else {

            items.push(item);

        }


        renderItems();

        clearItemForm();

    }


    /* =========================================================
       RENDER ITEMS
       ========================================================= */

    function renderItems() {

        const tbody =
            document.getElementById("itemsTableBody");


        tbody.innerHTML = "";


        if (items.length === 0) {

            tbody.innerHTML = `

                <tr>

                    <td
                            colspan="10"
                            class="text-center text-muted py-4">

                        No items added yet.

                    </td>

                </tr>

            `;

            return;

        }


        items.forEach(function (item, index) {

            const lineNo = index + 1;

            const itemNo =
                `ITEM-${String(lineNo).padStart(6, "0")}`;

            const factoryCode =
                `FAC-${String(lineNo).padStart(6, "0")}`;


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${escapeHtml(lineNo)}
                </td>

                <td>
                    ${escapeHtml(itemNo)}
                </td>

                <td class="fw-medium">
                    ${escapeHtml(item.itemName)}
                </td>

                <td>
                    ${escapeHtml(item.reqQty)}
                </td>

                <td>
                    ${escapeHtml(item.uom)}
                </td>

                <td>
                    ${escapeHtml(item.reqDeliveryDate)}
                </td>

                <td>
                    ${escapeHtml(item.deliveryLocation || "-")}
                </td>

                <td>
                    ${escapeHtml(factoryCode)}
                </td>

                <td>
                    ${escapeHtml(item.description || "-")}
                </td>

                <td class="text-nowrap">

                    <button
                            type="button"
                            class="btn btn-sm btn-outline-primary me-1"
                            onclick="editItem(${index})">

                        <i class="bi bi-pencil"></i>
                        Edit

                    </button>

                    <button
                            type="button"
                            class="btn btn-sm btn-outline-danger"
                            onclick="removeItem(${index})">

                        <i class="bi bi-trash"></i>
                        Remove

                    </button>

                </td>

            `;


            tbody.appendChild(row);

        });

    }


    /* =========================================================
       EDIT
       ========================================================= */

    function editItem(index) {

        const item = items[index];

        editIndex = index;


        document.getElementById("itemName").value =
            item.itemName;

        document.getElementById("reqQty").value =
            item.reqQty;

        document.getElementById("uom").value =
            item.uom;

        document.getElementById("reqDeliveryDate").value =
            item.reqDeliveryDate;

        document.getElementById("deliveryLocation").value =
            item.deliveryLocation || "";

        document.getElementById("description").value =
            item.description || "";


        document.getElementById("lineNo").value =
            index + 1;

        document.getElementById("itemNo").value =
            `ITEM-${String(index + 1).padStart(6, "0")}`;

        document.getElementById("factoryCode").value =
            `FAC-${String(index + 1).padStart(6, "0")}`;


        document.getElementById("itemActionButton").innerHTML = `

            <i class="bi bi-check-lg me-1"></i>
            Update Item

        `;


        document.getElementById("itemName").focus();

    }


    /* =========================================================
       REMOVE
       ========================================================= */

    function removeItem(index) {

        items.splice(index, 1);

        editIndex = -1;

        renderItems();

        clearItemForm();

    }


    /* =========================================================
       CLEAR
       ========================================================= */

    function clearItemForm() {

        document.getElementById("itemName").value = "";

        document.getElementById("reqQty").value = "";

        document.getElementById("uom").value = "";

        document.getElementById("reqDeliveryDate").value = "";

        document.getElementById("deliveryLocation").value = "";

        document.getElementById("description").value = "";


        editIndex = -1;


        const lineNo = items.length + 1;


        document.getElementById("lineNo").value =
            lineNo;

        document.getElementById("itemNo").value =
            `ITEM-${String(lineNo).padStart(6, "0")}`;

        document.getElementById("factoryCode").value =
            `FAC-${String(lineNo).padStart(6, "0")}`;


        document.getElementById("itemActionButton").innerHTML = `

            <i class="bi bi-plus-lg me-1"></i>
            Add Item

        `;

    }


    /* =========================================================
       SPRING BOOT ITEM BINDING
       ========================================================= */

    function prepareItemsForSubmit() {

        document
            .querySelectorAll(".generated-item-input")
            .forEach(function (input) {

                input.remove();

            });


        const form =
            document.getElementById("rfqForm");


        items.forEach(function (item, index) {

            addHiddenInput(
                form,
                `items[${index}].itemName`,
                item.itemName
            );

            addHiddenInput(
                form,
                `items[${index}].reqQty`,
                item.reqQty
            );

            addHiddenInput(
                form,
                `items[${index}].uom`,
                item.uom
            );

            addHiddenInput(
                form,
                `items[${index}].reqDeliveryDate`,
                item.reqDeliveryDate
            );

            addHiddenInput(
                form,
                `items[${index}].deliveryLocation`,
                item.deliveryLocation || ""
            );

            addHiddenInput(
                form,
                `items[${index}].description`,
                item.description || ""
            );

        });

    }


    function addHiddenInput(form, name, value) {

        const input =
            document.createElement("input");


        input.type = "hidden";

        input.name = name;

        input.value = value || "";


        input.classList.add(
            "generated-item-input"
        );


        form.appendChild(input);

    }


    /* =========================================================
       FORM SUBMIT
       ========================================================= */

    document
        .getElementById("rfqForm")
        .addEventListener(
            "submit",
            function () {

                prepareItemsForSubmit();

            }
        );


    /* =========================================================
       VENDOR SELECT ALL
       ========================================================= */

    const selectAll =
        document.getElementById(
            "selectAllVendors"
        );


    const vendorButton =
        document.getElementById(
            "vendorDropdownButton"
        );


    function updateVendorButton() {

        const all =
            document.querySelectorAll(
                ".vendor-checkbox"
            );

        const selected =
            document.querySelectorAll(
                ".vendor-checkbox:checked"
            );


        if (selected.length === 0) {

            vendorButton.textContent =
                "Select Vendors";

        }

        else if (
            all.length > 0 &&
            selected.length === all.length
        ) {

            vendorButton.textContent =
                "All Vendors Selected";

        }

        else {

            vendorButton.textContent =
                selected.length +
                " Vendor" +
                (selected.length > 1 ? "s" : "") +
                " Selected";

        }

    }


    if (selectAll) {

        selectAll.addEventListener(
            "change",
            function () {

                document
                    .querySelectorAll(
                        ".vendor-checkbox"
                    )
                    .forEach(function (checkbox) {

                        checkbox.checked =
                            selectAll.checked;

                    });


                updateVendorButton();

            }
        );

    }


    document
        .querySelectorAll(".vendor-checkbox")
        .forEach(function (checkbox) {

            checkbox.addEventListener(
                "change",
                function () {

                    const all =
                        document.querySelectorAll(
                            ".vendor-checkbox"
                        );

                    const selected =
                        document.querySelectorAll(
                            ".vendor-checkbox:checked"
                        );


                    selectAll.checked =
                        all.length > 0 &&
                        all.length === selected.length;


                    updateVendorButton();

                }
            );

        });


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            showStep(1);

            renderItems();

            updateVendorButton();

        }
    );

    document.getElementById('rfqForm').addEventListener('submit',async function(event){

        event.preventDefault();

        const response=await fetch('/auth/refresh',{
            method:'POST',
            credentials:'same-origin'
        });

        if(!response.ok){
            window.location.href='/auth/login';
            return;
        }

        this.submit();
    });

</script>
