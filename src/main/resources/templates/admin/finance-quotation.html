<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Finance Quotation - ForgeHub</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <!-- Existing Admin CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/admin.css}">

</head>


<body>


<!-- =========================================================
     ADMIN SIDEBAR
     ========================================================= -->

<div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>


<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main class="admin-content">

    <div class="container-fluid p-0">


        <!-- =================================================
             PAGE HEADER
             ================================================= -->

        <div class="mb-4">

            <h2 class="fw-bold mb-1">
                Finance Quotation
            </h2>

            <p class="text-muted mb-0">
                Finalized vendor quotations for finance processing.
            </p>

        </div>


        <!-- =================================================
             FINANCE QUOTATION TABLE
             ================================================= -->

        <div class="card border-0 shadow-sm">


            <!-- =========================
                 EMPTY STATE
            ========================== -->

            <div
                    th:if="${#lists.isEmpty(quotations)}"
                    class="text-center py-5">

                <i class="bi bi-receipt fs-1 text-muted"></i>

                <h5 class="mt-3">
                    No finalized quotations
                </h5>

                <p class="text-muted mb-0">
                    Finalized vendor quotations will appear here.
                </p>

            </div>


            <!-- =========================
                 TABLE
            ========================== -->

            <div
                    th:unless="${#lists.isEmpty(quotations)}"
                    class="table-responsive">

                <table
                        class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>

                        <th>
                            RFQ No
                        </th>

                        <th>
                            Bid No
                        </th>

                        <th>
                            Vendor
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Finalized Date
                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr
                            th:each="quotation : ${quotations}">


                        <!-- =========================
                             RFQ NO
                        ========================== -->

                        <td>

                            <span
                                    th:text="${quotation.rfqNo}">
                                RFQ/26/000001
                            </span>

                        </td>


                        <!-- =========================
                             BID NO
                        ========================== -->

                        <td>

                            <span
                                    th:text="${quotation.bidNo}">
                                BID-000001-1
                            </span>

                        </td>


                        <!-- =========================
                             VENDOR
                        ========================== -->

                        <td>

                            <span
                                    th:text="${quotation.vendorName}">
                                Vendor Name
                            </span>

                        </td>


                        <!-- =========================
                             AMOUNT
                        ========================== -->

                        <td>

                            <span
                                    class="fw-semibold"
                                    th:text="${quotation.quotedAmount}">
                                0.0000
                            </span>

                        </td>


                        <!-- =========================
                             FINALIZED DATE
                        ========================== -->

                        <td>

                            <span
                                    th:text="${#temporals.format(quotation.finalizedDate, 'dd-MM-yyyy HH:mm')}">
                                03-10-2026 09:10
                            </span>

                        </td>


                    </tr>

                    </tbody>

                </table>

            </div>

        </div>


    </div>

</main>


<!-- Bootstrap JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
