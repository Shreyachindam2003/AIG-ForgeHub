<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open RFQ - ForgeHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{fragments/vendor-sidebar :: sidebar}"></div>

<main class="admin-content">
    <div class="container-fluid p-0">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h2 class="fw-bold mb-1">Open RFQ</h2>
                <p class="text-muted mb-0">RFQs assigned to<strong th:text="${vendor.fullName}">Vendor</strong></p>
            </div>
            <span class="badge text-bg-primary fs-6" th:text="'Vendor ID: ' + ${vendorId}">Vendor ID: 1</span>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div th:if="${#lists.isEmpty(rfqs)}" class="text-center py-5">
                    <i class="bi bi-inbox fs-1 text-muted"></i>
                    <h5 class="mt-3">No open RFQs</h5>
                    <p class="text-muted mb-0">No active RFQ has been assigned to you.</p>
                </div>

                <div th:unless="${#lists.isEmpty(rfqs)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>RFQ No</th>
                            <th>Items</th>
                            <th>Factory</th>
                            <th>Bid Start</th>
                            <th>Bid End</th>
                            <th>Status</th>
                            <th class="text-center">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="rfq : ${rfqs}">
                            <td class="fw-semibold text-primary" th:text="${rfq.rfqNo}">RFQ-000001</td>
                            <td th:text="${rfq.items != null ? rfq.items.size() : 0}">2</td>
                            <td th:text="${rfq.items != null and !rfq.items.isEmpty() ? rfq.items.get(0).factoryCode : '-'}">FAC-01</td>
                            <td th:text="${rfq.bidDate != null ? #temporals.format(rfq.bidDate, 'dd-MM-yyyy') : '-'}">01-10-2026</td>
                            <td th:text="${rfq.expiryDateOfBid != null ? #temporals.format(rfq.expiryDateOfBid, 'dd-MM-yyyy') : '-'}">05-10-2026</td>
                            <td><span class="badge text-bg-success" th:text="${rfq.status}">OPEN</span></td>
                            <td class="text-center">
                                <a class="btn btn-sm btn-primary"
                                   th:href="@{/vendor/rfq/{id}(id=${rfq.rfqId},vendorId=${vendorId})}">
                                    <i class="bi bi-eye me-1"></i>View & Quote
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
